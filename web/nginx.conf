server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Les fichiers dans /assets/ ont un hash dans leur nom (ex.
  # index-3onZHLzZ.css) — un nouveau déploiement produit toujours un nouveau
  # nom de fichier, donc on peut les mettre en cache très longtemps sans
  # risque de servir une vieille version après une mise à jour.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html, lui, ne doit JAMAIS être mis en cache — c'est lui qui
  # référence les bons noms de fichiers hashés à chaque déploiement.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
